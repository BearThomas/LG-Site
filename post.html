<!DOCTYPE html>
<html lang="zh">
<head>
    <script>
        (function() {
            const t = localStorage.getItem('theme') || 'auto';
            const isDark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龙高北小站 | 帖子详情</title>
    <link rel="icon" type="image/png" href="./image/LG.png">
    <link rel="stylesheet" href="./css/light/forall.css">
    <link rel="stylesheet" href="./css/light/posts.css">
    <link rel="stylesheet" href="./css/light/post-detail.css">
</head>
<body>
    <!-- 导航栏 -->
    <div class="title-bar">
        <img src="image/LG.png" width="70px" height="70px" style="padding: 7px;padding-left: 20px;" alt="Logo" onclick="location.href='index.html'">
        <h1 class="site-title" onclick="location.href='./'">龙高北小站</h1>
        <ul class="nav-bar">
            <li class="nav-bar-item" onclick="location.href='./'"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-door" viewBox="0 0 16 16" style="margin-right: 4px; vertical-align: text-bottom;"><path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146ZM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4H2.5Z"/></svg>首页</li>
            <li class="nav-bar-item active" onclick="location.href='posts'"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stickies" viewBox="0 0 16 16" style="margin-right: 4px; vertical-align: text-bottom;"><path d="M1.5 0A1.5 1.5 0 0 0 0 1.5V13a1 1 0 0 0 1 1V1.5a.5.5 0 0 1 .5-.5H14a1 1 0 0 0-1-1H1.5z"/><path d="M3.5 2A1.5 1.5 0 0 0 2 3.5v11A1.5 1.5 0 0 0 3.5 16h6.086a1.5 1.5 0 0 0 1.06-.44l4.915-4.914A1.5 1.5 0 0 0 16 9.586V3.5A1.5 1.5 0 0 0 14.5 2h-11zM3 3.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5V9h-4.5A1.5 1.5 0 0 0 9 10.5V15H3.5a.5.5 0 0 1-.5-.5v-11zm7 11.293V10.5a.5.5 0 0 1 .5-.5h4.293L10 14.793z"/></svg>帖子</li>
            <li class="nav-bar-item" onclick="location.href='confession'"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-heart" viewBox="0 0 16 16" style="margin-right: 4px; vertical-align: text-bottom;"><path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"/></svg>表白墙</li>
            <li class="nav-bar-item" onclick="location.href='messages.html'" id="navMessages"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bell" viewBox="0 0 16 16" style="margin-right: 4px; vertical-align: text-bottom;"><path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.079.029C5.019 2.244 3 4.793 3 8l-.007.868c-.004.456-.054.914-.148 1.365-.125.603-.347 1.187-.655 1.713a1.2 1.2 0 0 0-.147.258h11.914a1.2 1.2 0 0 0-.147-.258c-.308-.526-.53-1.11-.655-1.713-.094-.45-.144-.91-.148-1.365L13 8c0-3.207-2.019-5.756-4.921-6.053zM8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0z"/></svg>消息</li>
            <li class="nav-bar-item" onclick="location.href='docs'"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-question-circle" viewBox="0 0 16 16" style="margin-right: 4px; vertical-align: text-bottom;"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286zm1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94z"/></svg>帮助</li>
        </ul>
        
        <!-- 登录状态区域 -->
                    <div class="user-area" id="userArea">
                <div class="user-not-login" id="userNotLogin">
                    <a href="login.html" class="login-link">登录</a>
                    <span class="divider">/</span>
                    <a href="login.html#register" class="register-link">注册</a>
                </div>
                <div class="user-logged-in" id="userLoggedIn" style="display: none;">
                    <span class="user-name" id="userName">同学</span>
                    <div class="user-dropdown">
                        <button class="user-avatar" id="userAvatar"></button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="./profile" id="profileLink"> 个人中心 </a>
                            <a href="#" id="logoutBtn"> 退出登录</a>
                        </div>
                    </div>
                </div>
            </div>
    </div>

    <!-- 主内容区 -->
    <div class="post-detail-container">
        <!-- 面包屑导航 -->
        <div class="breadcrumb">
            <a href="posts.html">← 返回帖子广场</a>
        </div>

        <!-- 帖子主体 -->
        <div class="post-detail-card" id="postDetailCard">
            <div class="loading-state"></div>
        </div>

        <!-- 评论区 -->
        <div class="comments-section" id="commentsSection">
            <div class="comments-header">
                <h3> 评论 (<span id="commentCount">0</span>)</h3>
            </div>
            
            <!-- 评论输入框 -->
            <div class="comment-input-box" id="commentInputBox">
                <div class="comment-avatar" id="commentAvatar">?</div>
                <div class="comment-input-wrapper">
                    <textarea id="commentContent" placeholder="写下你的评论..." rows="2" maxlength="500"></textarea>
                    <div class="comment-actions">
                        <span class="comment-tip"> 友善交流</span>
                        <button class="submit-comment-btn" id="submitCommentBtn">发 布</button>
                    </div>
                </div>
            </div>
            
            <!-- 未登录提示 -->
            <div class="login-tip" id="loginTip" style="display: none;">
                <p>请先<a href="login.html">登录</a>后发表评论</p>
            </div>

            <!-- 评论列表 -->
            <div class="comments-list" id="commentsList">
                <!-- 动态加载评论 -->
            </div>
        </div>
    </div>

    <!-- 编辑帖子弹窗 -->
    <div class="modal-overlay" id="editModal" style="display: none;">
        <div class="modal-container editor-modal-container">
            <div class="modal-header">
                <h3>编辑帖子</h3>
                <div class="editor-header-actions">
                    <button type="button" class="preview-toggle-btn" id="toggleEditPreviewBtn">预览</button>
                    <button class="modal-close" id="closeEditModalBtn">&times;</button>
                </div>
            </div>

            <div class="modal-body editor-modal-body">
                <div class="editor-layout">
                    <div class="editor-pane">
                        <div class="form-group">
                            <label>标题</label>
                            <input type="text" id="editTitle" placeholder="输入标题" maxlength="100">
                        </div>

                        <div class="form-group editor-content-group">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <label style="margin-bottom: 0;">正文</label>
                                <button type="button" class="upload-image-btn" id="uploadImageEditBtn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-image" viewBox="0 0 16 16">
                                      <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                                      <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/>
                                    </svg>
                                    插入图片
                                </button>
                                <input type="file" id="imageFileEditInput" accept="image/jpeg, image/png, image/webp, image/gif" style="display: none;">
                            </div>
                            <textarea id="editContent" placeholder="正文支持 Markdown" maxlength="10000"></textarea>
                        </div>
                    </div>

                    <div class="preview-pane markdown-body" id="editPreviewPane">
                        <div class="preview-empty">预览将在这里显示</div>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="cancel-btn" id="cancelEditBtn">取消</button>
                    <button class="submit-btn" id="submitEditBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="deleteModal" style="display: none;">
        <div class="modal-container modal-small">
            <div class="modal-header">
                <h3>确认删除</h3>
            </div>
            <div class="modal-body">
                <p>确定要删除这篇帖子吗？此操作不可恢复。</p>
                <div class="form-actions">
                    <button class="cancel-btn" id="cancelDeleteBtn">取消</button>
                    <button class="submit-btn danger-btn" id="confirmDeleteBtn">删除</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/theme-change.js"></script>
    <script src="./js/dynamic-bg.js"></script>
    <script src="./js/nav-bar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script type="module" src="./js/post-detail.js"></script>
    
</body>
</html>
