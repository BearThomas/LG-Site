<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        (function() {
            const t = localStorage.getItem('theme') || 'auto';
            const isDark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龙高北小站 | 系统设置</title>
    <link rel="icon" type="image/png" href="./image/LG.png">
    <link rel="stylesheet" href="./css/light/forall.css">
    <link rel="stylesheet" href="./css/light/docs.css">
    <style>
        .settings-option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .theme-option-card {
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            background: var(--surface);
            cursor: pointer;
            transition: all 0.2s var(--ease);
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        .theme-option-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .theme-option-card.active {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .theme-option-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--text);
        }
        .theme-option-desc {
            font-size: 0.85rem;
            color: var(--text-2);
            line-height: 1.4;
        }
        .radio-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: inline-block;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
        }
        .theme-option-card.active .radio-dot {
            border-color: var(--accent);
            background: var(--accent);
            box-shadow: inset 0 0 0 3px var(--surface);
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <img src="image/LG.png" width="70px" height="70px" style="padding: 7px;padding-left: 20px;" alt="Logo" onclick="location.href='index.html'">
        <h1 class="site-title" onclick="location.href='./'">龙高北小站</h1>
        <ul class="nav-bar">
            <li class="nav-bar-item" onclick="location.href='./'">首页</li>
            <li class="nav-bar-item" onclick="location.href='posts'">帖子</li>
            <li class="nav-bar-item" onclick="location.href='confession'">表白墙</li>
        </ul>
        <div class="user-area" id="userArea">
            <div class="user-not-login" id="userNotLogin">
                <a href="login.html" class="login-link">登录</a>
            </div>
            <div class="user-logged-in" id="userLoggedIn" style="display: none;">
                <span class="user-name" id="userName">同学</span>
                <div class="user-dropdown">
                    <button class="user-avatar" id="userAvatar"></button>
                    <div class="dropdown-menu" id="dropdownMenu"></div>
                </div>
            </div>
        </div>
    </div>

    <main class="docs-shell">
        <aside class="docs-sidebar">
            <nav class="docs-tree" id="settingsTree" aria-label="设置目录">
                <div class="docs-folder-title">系统偏好</div>
                <ul>
                    <li><a href="#" class="active" id="menuThemeSetting">主题外观</a></li>
                </ul>
                <div class="docs-folder-title">账号与服务</div>
                <ul>
                    <li><a href="profile.html">个人资料中心</a></li>
                    <li><a href="docs.html">帮助与说明文档</a></li>
                </ul>
            </nav>
        </aside>

        <article class="docs-content">
            <div class="docs-breadcrumb">设置 / 系统偏好 / 主题外观</div>
            <div class="docs-article">
                <h2 style="margin-top:0; margin-bottom: 8px; color: var(--text);">主题外观设置</h2>
                <p style="color: var(--text-2); font-size: 0.9rem; margin-bottom: 24px;">根据您的偏好自定义龙高北小站的显示主题。</p>

                <div class="settings-option-grid" id="themeOptionsContainer">
                    <div class="theme-option-card" data-theme-val="auto">
                        <div class="theme-option-header">
                            <span>跟随系统</span>
                            <span class="radio-dot"></span>
                        </div>
                        <div class="theme-option-desc">自动匹配手机或电脑系统的浅色/深色外观设置</div>
                    </div>

                    <div class="theme-option-card" data-theme-val="light">
                        <div class="theme-option-header">
                            <span>浅色模式</span>
                            <span class="radio-dot"></span>
                        </div>
                        <div class="theme-option-desc">明亮清爽的经典浅色界面</div>
                    </div>

                    <div class="theme-option-card" data-theme-val="dark">
                        <div class="theme-option-header">
                            <span>深色模式</span>
                            <span class="radio-dot"></span>
                        </div>
                        <div class="theme-option-desc">舒适护眼的深色极简界面</div>
                    </div>
                </div>
            </div>
        </article>
    </main>

    <script src="./js/theme-change.js"></script>
    <script src="./js/nav-bar.js"></script>
    <script src="./js/settings.js"></script>
</body>
</html>
