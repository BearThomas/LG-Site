<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龙高北小站 | 主题工坊</title>
    <link rel="icon" type="image/png" href="./image/LG.png">
    <link rel="stylesheet" href="./css/light/forall.css?v=1784279211277">
    <style>
        .theme-container { max-width: 1200px; margin: 40px auto; padding: 0 5%; display: flex; gap: 40px; }
        .theme-main { flex: 2; display: flex; flex-direction: column; gap: 40px; }
        .theme-sidebar { flex: 1; position: sticky; top: 120px; height: fit-content; }
        
        .theme-panel {
            background: var(--card-bg); backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border); border-radius: 12px; padding: 30px;
            box-shadow: var(--shadow-md);
        }
        .theme-panel h2 { font-family: var(--font-serif); font-size: 1.8rem; margin-bottom: 24px; color: var(--text-primary); border-bottom: 1px solid var(--glass-border); padding-bottom: 16px; }
        
        /* Preset Grid */
        .preset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
        .preset-card {
            border: 1px solid var(--glass-border); border-radius: 8px; padding: 16px; text-align: center;
            cursor: pointer; transition: all 0.3s; background: transparent; color: var(--text-primary);
        }
        .preset-card:hover { border-color: var(--accent-color); background: var(--accent-soft); transform: translateY(-3px); }
        .preset-color { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 10px; border: 1px solid rgba(255,255,255,0.2); }

        /* Custom Colors */
        .color-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .color-row label { font-size: 0.9rem; color: var(--text-secondary); }
        .color-row input[type="color"] {
            -webkit-appearance: none; border: none; width: 40px; height: 40px;
            border-radius: 8px; cursor: pointer; background: transparent;
        }
        .color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-row input[type="color"]::-webkit-color-swatch { border: 1px solid var(--glass-border); border-radius: 8px; }

        /* Preview Card */
        .preview-box { margin-top: 20px; }
        .preview-title { font-size: 1.2rem; margin-bottom: 10px; color: var(--text-primary); }
        .preview-text { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 16px; }
        
        .action-buttons { display: flex; gap: 16px; margin-top: 24px; }
        
        @media screen and (max-width: 900px) {
            .theme-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="meteor-container" id="meteorContainer"></div>

    <!-- 顶栏 -->
    <header class="title-bar">
        <img src="./image/LG.png" alt="Logo" height="40">
        <h1 class="site-title" onclick="location.href='index.html'">龙高北小站</h1>
        <ul class="nav-bar">
            <li class="nav-bar-item" onclick="location.href='index.html'">首页</li>
            <li class="nav-bar-item" onclick="location.href='posts.html'">论坛</li>
            <li class="nav-bar-item" onclick="location.href='confession.html'">表白墙</li>
            <li class="nav-bar-item active" onclick="location.href='theme.html'">主题工坊</li>
        </ul>
        <div class="user-area">
            <div class="user-logged-in" id="userArea" style="display:none;">
                <div class="user-avatar" id="navAvatar" onclick="location.href='profile.html'"></div>
            </div>
        </div>
    </header>

    <div class="theme-container">
        <div class="theme-main">
            <div class="theme-panel">
                <h2>推荐主题预设</h2>
                <div class="preset-grid">
                    <div class="preset-card" onclick="applyPreset('default')">
                        <div class="preset-color" style="background: #000;"></div>
                        <div>暗夜流星</div>
                    </div>
                    <div class="preset-card" onclick="applyPreset('purple')">
                        <div class="preset-color" style="background: #a855f7;"></div>
                        <div>高阶紫</div>
                    </div>
                    <div class="preset-card" onclick="applyPreset('sky')">
                        <div class="preset-color" style="background: #63b3ed;"></div>
                        <div>青空</div>
                    </div>
                    <div class="preset-card" onclick="applyPreset('classic')">
                        <div class="preset-color" style="background: #ffffff;"></div>
                        <div>极简经典</div>
                    </div>
                </div>
            </div>

            <div class="theme-panel">
                <h2>自定义调色板</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">
                    点击下方颜色方块即可自由调整组件色彩。调色板生效时，将覆盖当前预设。
                </p>
                <div class="color-row">
                    <label>背景主色 (Background)</label>
                    <input type="color" id="colBgBase" value="#050505" onchange="updateCustomColor()">
                </div>
                <div class="color-row">
                    <label>强调色 (Accent / Hover)</label>
                    <input type="color" id="colAccent" value="#e2e8f0" onchange="updateCustomColor()">
                </div>
                <div class="color-row">
                    <label>卡片背景 (Card Background)</label>
                    <input type="color" id="colCardBg" value="#0f0f14" onchange="updateCustomColor()">
                </div>
                <div class="color-row">
                    <label>文字主色 (Text Primary)</label>
                    <input type="color" id="colText" value="#f8fafc" onchange="updateCustomColor()">
                </div>
                
                <div class="action-buttons" style="margin-top: 30px;">
                    <button class="new-post-btn" onclick="saveCustomColors()">应用自定义配置</button>
                    <button class="save-btn" onclick="clearTheme()">恢复默认</button>
                </div>
            </div>
        </div>

        <div class="theme-sidebar">
            <div class="theme-panel" style="margin-bottom: 30px;">
                <h2>实时预览</h2>
                <div class="post-card preview-box" style="margin-bottom: 0;">
                    <div class="post-header" style="margin-bottom: 12px;">
                        <div class="post-avatar">U</div>
                        <span class="post-author">主题演示器</span>
                    </div>
                    <div class="preview-title">实时观察组件色彩变化</div>
                    <div class="preview-text">您在左侧调整的任何颜色配置，都将在这里立刻反映出来。卡片的边框、背景、以及按钮悬停等。</div>
                    <button class="new-post-btn">强调色按钮</button>
                </div>
            </div>

            <div class="theme-panel">
                <h2>分享与导入</h2>
                <div class="action-buttons" style="flex-direction: column;">
                    <button class="save-btn" onclick="exportThemeCode()">导出主题代码</button>
                    <button class="save-btn" onclick="importThemeCode()">导入主题代码</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/theme-change.js?v=1784279211277"></script>
    <script>
        // 生成流星
        const container = document.getElementById('meteorContainer');
        for (let i = 0; i < 20; i++) {
            let meteor = document.createElement('div');
            meteor.classList.add('meteor');
            meteor.style.left = Math.random() * 100 + 'vw';
            meteor.style.top = Math.random() * 100 + 'vh';
            meteor.style.animationDuration = (Math.random() * 3 + 2) + 's';
            meteor.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(meteor);
        }

        function applyPreset(name) {
            ThemeManager.saveTheme({ preset: name });
            alert('已应用预设主题！');
        }

        function hexToRgb(hex) {
            var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function updateCustomColor() {
            const bg = document.getElementById('colBgBase').value;
            const accent = document.getElementById('colAccent').value;
            const card = document.getElementById('colCardBg').value;
            const text = document.getElementById('colText').value;

            const rgbAccent = hexToRgb(accent);
            const rgbCard = hexToRgb(card);
            const accentSoft = rgbAccent ? \`rgba(\${rgbAccent.r}, \${rgbAccent.g}, \${rgbAccent.b}, 0.15)\` : accent;
            const cardTrans = rgbCard ? \`rgba(\${rgbCard.r}, \${rgbCard.g}, \${rgbCard.b}, 0.7)\` : card;

            const colors = {
                '--bg-base': bg,
                '--bg-gradient': \`linear-gradient(to bottom, \${bg}, #111)\`,
                '--accent-color': accent,
                '--accent-hover': accent,
                '--accent-soft': accentSoft,
                '--card-bg': cardTrans,
                '--board-bg': cardTrans,
                '--text-primary': text
            };

            for (const [k, v] of Object.entries(colors)) {
                document.documentElement.style.setProperty(k, v);
            }
        }

        function saveCustomColors() {
            const bg = document.getElementById('colBgBase').value;
            const accent = document.getElementById('colAccent').value;
            const card = document.getElementById('colCardBg').value;
            const text = document.getElementById('colText').value;

            const rgbAccent = hexToRgb(accent);
            const rgbCard = hexToRgb(card);
            const accentSoft = rgbAccent ? \`rgba(\${rgbAccent.r}, \${rgbAccent.g}, \${rgbAccent.b}, 0.15)\` : accent;
            const cardTrans = rgbCard ? \`rgba(\${rgbCard.r}, \${rgbCard.g}, \${rgbCard.b}, 0.7)\` : card;

            ThemeManager.saveTheme({
                colors: {
                    '--bg-base': bg,
                    '--bg-gradient': \`linear-gradient(to bottom, \${bg}, #111)\`,
                    '--accent-color': accent,
                    '--accent-hover': accent,
                    '--accent-soft': accentSoft,
                    '--card-bg': cardTrans,
                    '--board-bg': cardTrans,
                    '--text-primary': text
                }
            });
            alert('自定义调色板已保存并应用全站！');
        }

        function clearTheme() {
            ThemeManager.clearTheme();
            alert('已恢复全站默认主题。');
        }

        function exportThemeCode() {
            const code = ThemeManager.exportTheme();
            if (!code) {
                alert('您当前使用的是默认主题，没有可以导出的自定义代码。');
                return;
            }
            prompt('复制下方的主题代码分享给好友：', code);
        }

        function importThemeCode() {
            const code = prompt('请输入主题代码：');
            if (code) {
                if (ThemeManager.importTheme(code)) {
                    alert('导入成功！');
                } else {
                    alert('无效的主题代码！');
                }
            }
        }
    </script>
</body>
</html>
