<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龙高北小站 | 版主中心</title>
    <link rel="icon" type="image/png" href="./image/LG.png">
    <link rel="stylesheet" href="./css/light/forall.css">
    <style>
        .manage-container {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 24px;
            box-sizing: border-box;
        }
        .selector-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-soft);
        }
        .selector-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }
        .board-select {
            padding: 10px 16px;
            font-size: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            min-width: 250px;
            outline: none;
        }
        .board-select:focus {
            border-color: var(--accent);
        }
        .manage-layout {
            display: flex;
            gap: 24px;
        }
        @media (max-width: 768px) {
            .manage-layout {
                flex-direction: column;
            }
        }
        .manage-tabs {
            width: 220px;
            flex-shrink: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 16px 8px;
            box-shadow: var(--shadow-soft);
            height: fit-content;
        }
        @media (max-width: 768px) {
            .manage-tabs {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 12px;
            }
        }
        .tab-item {
            display: block;
            width: 100%;
            padding: 12px 16px;
            text-align: left;
            border-radius: var(--radius-lg);
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 4px;
        }
        @media (max-width: 768px) {
            .tab-item {
                width: auto;
                flex: 1 1 calc(50% - 8px);
                text-align: center;
                margin-bottom: 0;
            }
        }
        .tab-item:hover {
            background: var(--surface-2);
        }
        .tab-item.active {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }
        .manage-content {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: var(--shadow-soft);
            box-sizing: border-box;
            min-height: 400px;
        }
        .panel-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.25rem;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }
        .data-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            transition: background 0.15s;
        }
        .data-card:hover {
            background: var(--surface-3);
        }
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .card-primary {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
        }
        .card-secondary {
            font-size: 0.85rem;
            color: var(--muted);
        }
        .card-actions {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            cursor: pointer;
            background: var(--surface);
            color: var(--text);
            transition: all 0.15s;
        }
        .action-btn.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .action-btn.primary:hover {
            background: var(--accent-hover);
        }
        .action-btn.danger {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        .action-btn.danger:hover {
            background: var(--danger-hover);
        }
        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 40px 0;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }
        .form-group textarea, .form-group select, .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface);
            color: var(--text);
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
        }
        .form-group textarea:focus, .form-group select:focus, .form-group input:focus {
            border-color: var(--accent);
        }
        /* Mobile responsive adjustments */
        @media (max-width: 480px) {
            .data-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .card-actions {
                width: 100%;
                justify-content: flex-end;
            }
            .action-btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <img src="image/LG.png" width="70px" height="70px" style="padding: 7px; padding-left: 20px;" alt="Logo">
        <h1 class="site-title" onclick="location.href='./'">龙高北小站</h1>
        <ul class="nav-bar">
            <li class="nav-bar-item" onclick="location.href='./'">首页</li>
            <li class="nav-bar-item" onclick="location.href='posts'">帖子</li>
            <li class="nav-bar-item" onclick="location.href='events'">大事记</li>
            <li class="nav-bar-item" onclick="location.href='confession'">表白墙</li>
            <li class="nav-bar-item" onclick="location.href='docs'">帮助</li>
        </ul>
        <div class="user-area" id="userArea">
            <div class="user-not-login" id="userNotLogin">
                <a href="login.html" class="login-link">登录</a>
                <span class="divider">/</span>
                <a href="login.html#register" class="register-link">注册</a>
            </div>
            <div class="user-logged-in" id="userLoggedIn" style="display: none;">
                <span class="user-name" id="userName">同学</span>
                <div class="user-dropdown">
                    <button class="user-avatar" id="userAvatar"></button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="./profile" id="profileLink"> 个人中心 </a>
                        <a href="#" id="logoutBtn">退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="manage-container">
        <div class="selector-section">
            <span class="selector-label">管理板块：</span>
            <select id="ownedBoardsSelect" class="board-select">
                <option value="">加载中...</option>
            </select>
        </div>

        <div class="manage-layout">
            <aside class="manage-tabs" id="tabContainer">
                <button class="tab-item active" data-tab="settings">⚙️ 基本设置</button>
                <button class="tab-item" data-tab="requests">📥 加入审批</button>
                <button class="tab-item" data-tab="members">👥 成员管理</button>
                <button class="tab-item" data-tab="posts">📝 帖子管理</button>
            </aside>

            <main class="manage-content" id="panelContainer">
                <!-- Content panels loaded dynamically -->
            </main>
        </div>
    </div>

    <!-- Post Migration Modal -->
    <div class="modal-overlay" id="migrationModal" style="display: none;">
        <div class="modal-container" style="max-width: 450px;">
            <div class="modal-header">
                <h3>迁移帖子</h3>
                <button class="modal-close" onclick="closeMigrationModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>目标板块</label>
                    <select id="targetBoardSelect"></select>
                </div>
                <div class="form-actions">
                    <button class="action-btn" onclick="closeMigrationModal()">取消</button>
                    <button class="action-btn primary" id="confirmMigrateBtn">确定迁移</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/theme-change.js"></script>
    <script src="./js/nav-bar.js"></script>
    <script type="module" src="./js/board-manage.js"></script>
</body>
</html>
