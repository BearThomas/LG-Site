<!DOCTYPE html>
<html lang="zh">
<head>
    <script>
        (function() {
            const t = localStorage.getItem('theme') || 'auto';
            const isDark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龙高北小站 | 帖子广场</title>
    <link rel="icon" type="image/png" href="./image/LG.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/image/LG.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="龙高北小站">
    <link rel="stylesheet" href="./css/light/forall.css">
    <link rel="stylesheet" href="./css/light/posts.css">
</head>
<div class="modal-overlay" id="createBoardModal" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3>创建新板块</h3>
            <button class="modal-close" id="closeBoardModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>板块标识 (英文缩写/拼音)</label>
                <input type="text" id="boardId" placeholder="如：photo (仅限小写英文、数字和中划线)" maxlength="20">
            </div>
            <div class="form-group">
                <label>板块名称</label>
                <input type="text" id="boardName" placeholder="如：摄影爱好者" maxlength="15">
            </div>
            <div class="form-group">
                <label>板块简介</label>
                <textarea id="boardDesc" placeholder="介绍一下这个板块..." rows="3" maxlength="100"></textarea>
            </div>
            <div class="form-group">
                <label>板块类型</label>
                <select id="boardType">
                    <option value="club">社团</option>
                    <option value="custom">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>加入设置</label>
                <select id="boardJoinType">
                    <option value="0">🌍 公开（任何人直接加入并可见）</option>
                    <option value="1">🔒 私密（需要版主审批同意）</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="cancel-btn" id="cancelBoardBtn">取消</button>
                <button class="submit-btn" id="submitBoardBtn">创建</button>
            </div>
        </div>
    </div>
</div>
<body>

        <!-- 登录状态区域 -->
                    <div class="user-area" id="userArea">
                <div class="user-not-login" id="userNotLogin">
                    <a href="login.html" class="login-link">登录</a>
                    <span class="divider">/</span>
                    <a href="login.html#register" class="register-link">注册</a>
                </div>
                <div class="user-logged-in" id="userLoggedIn" style="display: none;">
                    <span class="user-name" id="userName">同学</span>
                    <div class="user-dropdown">
                        <button class="user-avatar" id="userAvatar"></button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="./profile" id="profileLink"> 个人中心 </a>
                            <a href="#" id="logoutBtn"> 退出登录</a>
                        </div>
                    </div>
                </div>
            </div>
    </div>

    <!-- 主内容区 -->
    <div class="posts-container">
        
        <!-- 帖子时间线 -->
        <main class="posts-main">
            <!-- 极简一体化搜索与筛选栏 -->
            <div class="posts-mobile-toolbar">
                <div class="search-bar-group">
                    <input type="text" id="searchInput" class="connected-search-input" placeholder="搜索帖子...">
                    <button type="button" id="searchSubmitBtn" class="connected-search-btn" aria-label="搜索">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                        </svg>
                    </button>
                </div>

                <!-- 右侧圆形筛选按钮 -->
                <div class="filter-dropdown-wrap">
                    <button type="button" id="filterCircleBtn" class="filter-circle-btn" aria-label="筛选">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-filter" viewBox="0 0 16 16">
                            <path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/>
                        </svg>
                    </button>

                    <!-- 下弹筛选面板 -->
                    <div class="filter-dropdown-menu" id="filterDropdownMenu" style="display: none;">
                        <div class="filter-menu-group">
                            <label>时间范围</label>
                            <select id="timeFilter" class="filter-select">
                                <option value="all">全部时间</option>
                                <option value="today">今天</option>
                                <option value="week">本周</option>
                                <option value="month">本月</option>
                            </select>
                        </div>
                        <div class="filter-menu-group">
                            <label>排序规则</label>
                            <select id="sortFilter" class="filter-select">
                                <option value="new">最新发布</option>
                                <option value="hot">热度推荐</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 帖子列表 -->
            <div class="posts-list" id="postsList">
                <div class="feed-initial-loader" role="status">
                    <span class="feed-initial-orbit"></span>
                    
                </div>
            </div>

            <!-- 懒加载侦听器 -->
            <div id="infiniteScrollAnchor" class="infinite-scroll-anchor" style="height: 20px; display: flex; justify-content: center; align-items: center; margin: 20px 0; color: #868e96;">
                <!-- 动态显示加载状态 -->
            </div>
        </main>
    </div>

    <!-- 发帖弹窗 -->
    <div class="modal-overlay" id="postModal" style="display: none;">
        <div class="modal-container editor-modal-container">
            <div class="modal-header">
                <h3>发新帖</h3>

                <div class="editor-header-actions">
                    <button
                        type="button"
                        class="preview-toggle-btn"
                        id="togglePostPreviewBtn">
                        预览
                    </button>

                    <button
                        class="modal-close"
                        id="closeModalBtn">
                        &times;
                    </button>
                </div>
            </div>

            <div class="modal-body editor-modal-body">

                <div class="editor-layout">

                    <!-- 左侧编辑器 -->
                    <div class="editor-pane">

                        <div class="form-group">
                            <label>标题</label>
                            <input
                                type="text"
                                id="postTitle"
                                placeholder="输入标题（最多100字）"
                                maxlength="100">
                        </div>

                        <div class="form-group editor-content-group">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <label style="margin-bottom: 0;">内容（支持 Markdown）</label>
                                <button type="button" class="upload-image-btn" id="uploadImageBtn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-image" viewBox="0 0 16 16">
                                      <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                                      <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/>
                                    </svg>
                                    插入图片
                                </button>
                                <input type="file" id="imageFileInput" accept="image/jpeg, image/png, image/webp, image/gif" style="display: none;">
                            </div>

                            <textarea
                                id="postContent"
                                placeholder="# 一级标题

        ## 二级标题

        **加粗**
        *斜体*

        - 列表1
        - 列表2

        > 引用内容

        ```js
        console.log('Hello World');
        ```"
                                maxlength="10000"></textarea>
                        </div>

                    </div>

                    <!-- 右侧预览 -->
                    <div
                        class="preview-pane markdown-body"
                        id="postPreviewPane">

                        <div class="preview-empty">

                            <h2>Markdown 预览</h2>

                            <p>
                                在左侧输入内容后，
                                这里会实时显示最终效果。
                            </p>

                        </div>

                    </div>

                </div>

                <!-- 发布板块 (已隐藏) -->
                <div class="form-group" style="display: none;">
                    <label>发布到板块</label>
                    <div id="postBoardCheckboxes"></div>
                </div>

                <!-- 可见范围 -->
                <div class="form-group">
                    <label>可见范围</label>

                    <select id="visibilityType">
                        <option value="all">
                            🌍 全员可见
                        </option>

                        <option value="specific">
                            🔒 指定学号可见
                        </option>
                    </select>
                </div>

                <!-- 指定用户区域 -->
                <div id="specificUsersArea" style="display:none;">

                    <div class="form-group">

                        <label>添加可见用户</label>

                        <div class="user-search-box">

                            <input
                                type="text"
                                id="userSearchInput"
                                placeholder="输入学号搜索..."
                                maxlength="12"
                                autocomplete="off">

                            <button
                                type="button"
                                class="search-btn"
                                id="searchUserBtn">

                                <svg
                                    fill="#000000"
                                    width="15px"
                                    height="15px"
                                    viewBox="0 0 24 24"
                                    xmlns="http://www.w3.org/2000/svg">

                                    <path d="M21.71,20.29,18,16.61A9,9,0,1,0,16.61,18l3.68,3.68a1,1,0,0,0,1.42,0A1,1,0,0,0,21.71,20.29ZM11,18a7,7,0,1,1,7-7A7,7,0,0,1,11,18Z"/>

                                </svg>

                            </button>

                        </div>

                        <div
                            class="search-results"
                            id="searchResults"
                            style="display:none;">
                        </div>

                    </div>

                    <div class="form-group">

                        <label>
                            已选用户
                            (<span id="selectedCount">0</span>人)
                        </label>

                        <div
                            class="selected-users"
                            id="selectedUsers">

                            <div class="no-users-hint">
                                尚未添加用户
                            </div>

                        </div>

                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelPostBtn">
                        取消
                    </button>

                    <button
                        type="button"
                        class="submit-btn"
                        id="submitPostBtn">
                        发布
                    </button>

                </div>

            </div>
        </div>
    </div>

    <!-- 帖子详情弹窗 -->
    <div class="modal-overlay" id="postDetailModal" style="display: none;">
        <div class="modal-container post-detail-container">
            <div class="modal-header">
                <h3 id="detailTitle">帖子详情</h3>
                <button class="modal-close" id="closeDetailBtn">&times;</button>
            </div>
            <div class="modal-body" id="postDetailBody">
                <!-- 动态加载帖子详情 -->
            </div>
        </div>
    </div>

    <!-- 悬浮发帖按钮 (+) -->
    <button type="button" class="fab-btn" id="fabNewPostBtn" aria-label="发布新帖子" title="发布新帖子">+</button>

    <script src="./js/theme-change.js"></script>
    <script src="./js/dynamic-bg.js"></script>
    <script src="./js/nav-bar.js?v=20260720-4"></script>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script type="module" src="./js/posts.js?v=20260720-4"></script>
        
</body>
