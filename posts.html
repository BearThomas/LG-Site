<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龙高北小站 | 帖子广场</title>
    <link rel="icon" type="image/png" href="./image/LG.png">
    <link rel="stylesheet" href="./css/light/forall.css">
    <link rel="stylesheet" href="./css/light/posts.css">
</head>
<div class="modal-overlay" id="createBoardModal" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3>创建新板块</h3>
            <button class="modal-close" id="closeBoardModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>板块标识 (英文缩写/拼音)</label>
                <input type="text" id="boardId" placeholder="如：photo (仅限小写英文、数字和中划线)" maxlength="20">
            </div>
            <div class="form-group">
                <label>板块名称</label>
                <input type="text" id="boardName" placeholder="如：摄影爱好者" maxlength="15">
            </div>
            <div class="form-group">
                <label>板块简介</label>
                <textarea id="boardDesc" placeholder="介绍一下这个板块..." rows="3" maxlength="100"></textarea>
            </div>
            <div class="form-group">
                <label>板块类型</label>
                <select id="boardType">
                    <option value="club">社团</option>
                    <option value="custom">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>加入设置</label>
                <select id="boardJoinType">
                    <option value="0">🌍 公开（任何人直接加入并可见）</option>
                    <option value="1">🔒 私密（需要版主审批同意）</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="cancel-btn" id="cancelBoardBtn">取消</button>
                <button class="submit-btn" id="submitBoardBtn">创建</button>
            </div>
        </div>
    </div>
</div>
<body>
        <div class="meteor-container"><div class="meteor"></div><div class="meteor"></div><div class="meteor"></div><div class="meteor"></div><div class="meteor"></div></div>
    <!-- 导航栏 -->
    <div class="title-bar">
        <img src="image/LG.png" width="70px" height="70px" style="padding: 7px;padding-left: 20px;" alt="Logo">
        <h1 class="site-title" onclick="location.href='./'">龙高北小站</h1>
        <ul class="nav-bar">
            <li class="nav-bar-item" onclick="location.href='./'">首页</li>
            <li class="nav-bar-item active" onclick="location.href='posts'">帖子</li>
            <li class="nav-bar-item" onclick="location.href='events'">大事记</li>
            <li class="nav-bar-item" onclick="location.href='confession'">表白墙</li>
            <li class="nav-bar-item" onclick="location.href='docs'">帮助</li>
            <li class="nav-bar-item" onclick="location.href='theme.html'">主题</li>
        </ul>
        
        <!-- 登录状态区域 -->
        <div class="user-area" id="userArea">
            <div class="user-not-login" id="userNotLogin">
                <a href="login.html" class="login-link">登录</a>
                <span class="divider">/</span>
                <a href="login.html#register" class="register-link">注册</a>
            </div>
            <div class="user-logged-in" id="userLoggedIn" style="display: none;">
                <span class="user-name" id="userName">同学</span>
                <div class="user-dropdown">
                    <button class="user-avatar" id="userAvatar"></button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="./profile" id="profileLink"> 个人中心 </a>
                        <a href="#" id="logoutBtn">退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="posts-container">
        
        <!-- 帖子时间线 -->
        <main class="posts-main">
            <!-- 帖子墙精致卡片头部 -->
            <div class="posts-wall-header">
                <div class="wall-title-area">
                    <h2 class="wall-title">帖子墙</h2>
                    <p class="wall-subtitle">在这里，分享你的校园生活与心得感受 ✨</p>
                </div>
                <div class="wall-actions">
                    <button class="new-post-btn-pill" id="newPostBtn">
                        <span class="btn-icon">✍️</span>
                        <span>发表新帖</span>
                    </button>
                </div>
            </div>

            <!-- 排序/筛选栏 -->
            <div class="posts-toolbar">
                <div class="filter-options">
                    <input type="text" id="searchInput" class="search-input" placeholder="搜索帖子..." style="padding: 6px 12px; border-radius: 6px; border: 1px solid #ced4da; margin-right: 10px; font-size: 0.9rem;">
                    <select id="timeFilter" class="time-filter">
                        <option value="all">全部时间</option>
                        <option value="today">今天</option>
                        <option value="week">本周</option>
                        <option value="month">本月</option>
                    </select>
                </div>
            </div>

            <!-- 帖子列表 -->
            <div class="posts-list" id="postsList">
                <div class="feed-initial-loader" role="status">
                    <span class="feed-initial-orbit"></span>
                    <span>正在准备帖子</span>
                </div>
            </div>

            <!-- 懒加载侦听器 -->
            <div id="infiniteScrollAnchor" class="infinite-scroll-anchor" style="height: 20px; display: flex; justify-content: center; align-items: center; margin: 20px 0; color: #868e96;">
                <!-- 动态显示加载状态 -->
            </div>
        </main>
    </div>

    <!-- 发帖弹窗 -->
    <div class="modal-overlay" id="postModal" style="display: none;">
        <div class="modal-container editor-modal-container">
            <div class="modal-header">
                <h3>发新帖</h3>

                <div class="editor-header-actions">
                    <button
                        type="button"
                        class="preview-toggle-btn"
                        id="togglePostPreviewBtn">
                        预览
                    </button>

                    <button
                        class="modal-close"
                        id="closeModalBtn">
                        &times;
                    </button>
                </div>
            </div>

            <div class="modal-body editor-modal-body">

                <div class="editor-layout">

                    <!-- 左侧编辑器 -->
                    <div class="editor-pane">

                        <div class="form-group">
                            <label>标题</label>
                            <input
                                type="text"
                                id="postTitle"
                                placeholder="输入标题（最多100字）"
                                maxlength="100">
                        </div>

                        <div class="form-group editor-content-group">
                            <label>内容（支持 Markdown）</label>

                            <textarea
                                id="postContent"
                                placeholder="# 一级标题

        ## 二级标题

        **加粗**
        *斜体*

        - 列表1
        - 列表2

        > 引用内容

        ```js
        console.log('Hello World');
        ```"
                                maxlength="10000"></textarea>
                        </div>

                    </div>

                    <!-- 右侧预览 -->
                    <div
                        class="preview-pane markdown-body"
                        id="postPreviewPane">

                        <div class="preview-empty">

                            <h2>Markdown 预览</h2>

                            <p>
                                在左侧输入内容后，
                                这里会实时显示最终效果。
                            </p>

                        </div>

                    </div>

                </div>

                <!-- 发布板块 (已隐藏) -->
                <div class="form-group" style="display: none;">
                    <label>发布到板块</label>
                    <div id="postBoardCheckboxes"></div>
                </div>

                <!-- 可见范围 -->
                <div class="form-group">
                    <label>可见范围</label>

                    <select id="visibilityType">
                        <option value="all">
                            🌍 全员可见
                        </option>

                        <option value="specific">
                            🔒 指定学号可见
                        </option>
                    </select>
                </div>

                <!-- 指定用户区域 -->
                <div id="specificUsersArea" style="display:none;">

                    <div class="form-group">

                        <label>添加可见用户</label>

                        <div class="user-search-box">

                            <input
                                type="text"
                                id="userSearchInput"
                                placeholder="输入学号搜索..."
                                maxlength="12"
                                autocomplete="off">

                            <button
                                type="button"
                                class="search-btn"
                                id="searchUserBtn">

                                <svg
                                    fill="#000000"
                                    width="15px"
                                    height="15px"
                                    viewBox="0 0 24 24"
                                    xmlns="http://www.w3.org/2000/svg">

                                    <path d="M21.71,20.29,18,16.61A9,9,0,1,0,16.61,18l3.68,3.68a1,1,0,0,0,1.42,0A1,1,0,0,0,21.71,20.29ZM11,18a7,7,0,1,1,7-7A7,7,0,0,1,11,18Z"/>

                                </svg>

                            </button>

                        </div>

                        <div
                            class="search-results"
                            id="searchResults"
                            style="display:none;">
                        </div>

                    </div>

                    <div class="form-group">

                        <label>
                            已选用户
                            (<span id="selectedCount">0</span>人)
                        </label>

                        <div
                            class="selected-users"
                            id="selectedUsers">

                            <div class="no-users-hint">
                                尚未添加用户
                            </div>

                        </div>

                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelPostBtn">
                        取消
                    </button>

                    <button
                        type="button"
                        class="submit-btn"
                        id="submitPostBtn">
                        发布
                    </button>

                </div>

            </div>
        </div>
    </div>

    <!-- 帖子详情弹窗 -->
    <div class="modal-overlay" id="postDetailModal" style="display: none;">
        <div class="modal-container post-detail-container">
            <div class="modal-header">
                <h3 id="detailTitle">帖子详情</h3>
                <button class="modal-close" id="closeDetailBtn">&times;</button>
            </div>
            <div class="modal-body" id="postDetailBody">
                <!-- 动态加载帖子详情 -->
            </div>
        </div>
    </div>

    <script src="./js/theme-change.js"></script>
    <script src="./js/dynamic-bg.js"></script>
    <script src="./js/nav-bar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script type="module" src="./js/posts.js"></script>
        
</body>
</html>
