<!DOCTYPE html>
<html lang="zh-CN">
    <head>
    <script>
        (function() {
            const t = localStorage.getItem('theme') || 'auto';
            const isDark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
        })();
    </script>
        <meta charset="UTF-8">
        <title>龙高北小站 | 个人中心</title>
        <link rel="icon" type="image/png" href="./image/LG.png">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="stylesheet" href="./css/light/forall.css">
        <style>
            /* 局部轻量样式补丁，用于支撑个人中心特有的双栏表单布局 */
            .profile-wrapper {
                max-width: 1100px;
                margin: 30px auto;
                padding: 0 20px;
                display: flex;
                gap: 30px;
            }
            @media (max-width: 768px) {
                .profile-wrapper {
                    flex-direction: column;
                }
            }
            .profile-sidebar {
                flex: 1;
                background: var(--surface);
                border-radius: 12px;
                padding: 30px 20px;
                text-align: center;
                box-shadow: 0 4px 12px var(--shadow, rgba(0,0,0,0.05));
                height: fit-content;
            }
            .avatar-preview {
                width: 90px;
                height: 90px;
                background-color: var(--accent);
                color: #ffffff;
                font-size: 2.2rem;
                font-weight: bold;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 15px;
                text-transform: uppercase;
                box-shadow: 0 4px 8px rgba(34, 139, 230, 0.25);
            }
            .profile-sidebar h3 {
                margin: 10px 0 5px;
                color: var(--text-primary);
                font-size: 1.3rem;
            }
            .user-id-tag {
                font-size: 0.85rem;
                color: var(--text-secondary);
                background: var(--border);
                padding: 4px 10px;
                border-radius: 20px;
                display: inline-block;
                margin-top: 5px;
            }
            .profile-main {
                flex: 2.5;
                display: flex;
                flex-direction: column;
                gap: 24px;
            }
            .settings-section {
                background: var(--surface);
                border-radius: 12px;
                padding: 24px;
                box-shadow: 0 4px 12px var(--shadow, rgba(0,0,0,0.05));
            }
            .settings-section h2 {
                font-size: 1.25rem;
                color: var(--text-primary);
                margin-top: 0;
                margin-bottom: 20px;
                border-bottom: 2px solid var(--border);
                padding-bottom: 10px;
            }
            .form-group {
                margin-bottom: 18px;
            }
            .form-group label {
                display: block;
                font-size: 0.9rem;
                font-weight: 600;
                color: var(--text-secondary);
                margin-bottom: 8px;
            }
            .form-group input {
                width: 100%;
                padding: 10px 14px;
                border: 1px solid var(--border);
                border-radius: 6px;
                font-size: 0.95rem;
                color: var(--text-secondary);
                box-sizing: border-box;
                transition: border-color 0.2s;
            }
            .form-group input:focus {
                outline: none;
                border-color: var(--accent);
            }
            .save-btn {
                background-color: var(--accent);
                color: #fff;
                border: none;
                padding: 10px 20px;
                font-size: 0.95rem;
                font-weight: 500;
                border-radius: 6px;
                cursor: pointer;
                transition: background-color 0.2s;
            }
            .save-btn:hover {
                background-color: var(--accent-hover);
            }
            .save-btn:disabled {
                background-color: #adb5bd;
                cursor: not-allowed;
            }
            .save-btn.danger {
                background-color: var(--danger, #fa5252);
            }
            .save-btn.danger:hover {
                background-color: var(--danger-hover, #e03131);
            }

            /* Minimal profile theme */
            .profile-wrapper {
                max-width: 1040px;
                gap: 22px;
            }

            .profile-sidebar,
            .settings-section {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-xl);
                box-shadow: var(--shadow-soft);
            }

            .profile-sidebar h3,
            .settings-section h2,
            .form-group label {
                color: var(--text);
            }

            .user-id-tag {
                background: var(--surface-2);
                color: var(--muted);
                border-radius: var(--radius-md);
            }

            .settings-section h2 {
                border-bottom-color: var(--border);
            }

            .form-group input {
                background: var(--surface);
                border-color: var(--border);
                color: var(--text);
                border-radius: var(--radius-md);
            }

            .form-group input:focus {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-soft);
            }

            .save-btn {
                background: var(--accent);
                border-radius: var(--radius-md);
            }

            .save-btn:hover {
                background: var(--accent-hover);
            }

            .save-btn.danger {
                background: var(--danger);
            }

            .avatar-preview {
                box-shadow: none;
                border: 1px solid var(--border);
            }

            @media (max-width: 768px) {
                body {
                    min-height: 100dvh;
                    overflow-x: hidden;
                }

                .profile-wrapper {
                    width: 100%;
                    max-width: none;
                    margin: 14px auto 0;
                    padding: 0 14px 96px;
                    gap: 16px;
                    box-sizing: border-box;
                }

                .profile-sidebar,
                .settings-section {
                    width: 100%;
                    padding: 18px;
                    box-sizing: border-box;
                    border-radius: var(--radius-lg);
                }

                .profile-main {
                    width: 100%;
                    gap: 16px;
                }

                .avatar-preview {
                    width: 78px;
                    height: 78px;
                    font-size: 1.8rem;
                    margin-bottom: 12px;
                }

                .profile-sidebar h3 {
                    font-size: 1.12rem;
                    word-break: break-word;
                }

                .settings-section h2 {
                    font-size: 1rem;
                    line-height: 1.4;
                    margin-bottom: 16px;
                }

                .form-group input {
                    min-height: 42px;
                    font-size: 0.95rem;
                }

                .save-btn {
                    width: 100%;
                    min-height: 42px;
                }
            }
        </style>
    </head>

                        <div class="user-area" id="userArea">
                <div class="user-not-login" id="userNotLogin">
                    <a href="login.html" class="login-link">登录</a>
                    <span class="divider">/</span>
                    <a href="login.html#register" class="register-link">注册</a>
                </div>
                <div class="user-logged-in" id="userLoggedIn" style="display: none;">
                    <span class="user-name" id="userName">同学</span>
                    <div class="user-dropdown">
                        <button class="user-avatar" id="userAvatar"></button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="./profile" id="profileLink"> 个人中心 </a>
                            <a href="#" id="logoutBtn"> 退出登录</a>
                        </div>
                    </div>
                </div>
            </div>

        <div class="profile-wrapper">
            
            <div class="profile-sidebar">
                <div class="avatar-preview" id="avatarPreview">
                    <span id="avatarText">?</span>
                    <img id="avatarImg" src="" alt="头像" style="display: none; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                </div>
                <h3 id="profileUsername"></h3>
                <span class="user-id-tag" id="profileUserId">ID: --</span>
            </div>

            <div class="profile-main">
                
                <div class="settings-section" id="myActivitySection">
                    <h2>我的足迹</h2>
                    <div class="activity-tabs" style="display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                        <button id="tabMyPosts" class="tab-btn active" style="background: none; border: none; font-size: 1rem; cursor: pointer; font-weight: bold; color: var(--accent);">我的发帖</button>
                        <button id="tabMyComments" class="tab-btn" style="background: none; border: none; font-size: 1rem; cursor: pointer; color: var(--text-secondary);">我的评论</button>
                    </div>

                    <div id="myPostsList" class="activity-list" style="max-height: 400px; overflow-y: auto;">
                        <div class="feed-initial-loader" style="text-align: center; padding: 20px;"><span class="feed-initial-orbit"></span> </div>
                    </div>

                    <div id="myCommentsList" class="activity-list" style="display: none; max-height: 400px; overflow-y: auto;">
                        <div class="feed-initial-loader" style="text-align: center; padding: 20px;"><span class="feed-initial-orbit"></span> </div>
                    </div>
                </div>
                
                <div class="settings-section">
                    <h2>个人资料设置</h2>
                    <div class="form-group">
                        <label for="nameInput">修改显示姓名 / 昵称</label>
                        <input type="text" id="nameInput" placeholder="请输入你的新名称" maxlength="12" autocomplete="off">
                    </div>
                    <div class="form-group" style="display: flex; gap: 10px; align-items: flex-end;">
                        <div style="flex: 1;">
                            <label for="avatarInput">自定义头像图片链接 (URL)</label>
                            <input type="url" id="avatarInput" placeholder="填入 https:// 开头的头像图片网址" autocomplete="off">
                        </div>
                        <button type="button" id="uploadAvatarBtn" class="upload-image-btn" style="height: 45px; margin-bottom: 2px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                              <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                              <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
                            </svg>上传图片
                        </button>
                        <input type="file" id="avatarFileInput" accept="image/png, image/jpeg, image/gif, image/webp" style="display: none;">
                    </div>
                    <button class="save-btn" id="saveProfileBtn">保存资料</button>
                </div>

                <div class="settings-section">
                    <h2>账户安全管理</h2>
                    <div class="form-group">
                        <label for="oldPasswordInput">当前旧密码</label>
                        <input type="password" id="oldPasswordInput" placeholder="请输入当前正在使用的密码">
                    </div>
                    <div class="form-group">
                        <label for="newPasswordInput">安全新密码</label>
                        <input type="password" id="newPasswordInput" placeholder="请输入新密码（长度至少8位）">
                    </div>
                    <button class="save-btn danger" id="updatePasswordBtn">修改账户密码</button>
                </div>

            </div>
        </div>

        <script src="./js/nav-bar.js"></script>
