<!DOCTYPE html>
<html>
    <head>
        <title>龙高北小站 | 首页</title>
        <link rel="icon" type="image/png" href="./image/LG.png">
        <link rel="stylesheet" href="./css/light/forall.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    </head>
    <body>
        <div class="meteor-container"><div class="meteor"></div><div class="meteor"></div><div class="meteor"></div><div class="meteor"></div><div class="meteor"></div></div>
        <script src="./js/theme-change.js"></script>
        <script src="./js/events.js"></script>
        <div class="title-bar">
            <img src="image/LG.png" width="70px" height="70px" style="padding: 7px;padding-left: 20px;">
            <h1 class="site-title" onclick="location.href='./'">龙高北小站</h1>
            <ul class="nav-bar">
                <li class="nav-bar-item active" onclick="location.href='./'">首页</li>
            <li class="nav-bar-item" onclick="location.href='posts'">帖子</li>
            <li class="nav-bar-item" onclick="location.href='events'">大事记</li>
            <li class="nav-bar-item" onclick="location.href='confession'"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-heart" viewBox="0 0 16 16" style="margin-right: 4px; vertical-align: text-bottom;"><path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"/></svg>表白墙</li>
            <li class="nav-bar-item" onclick="location.href='docs'">帮助</li>
            </ul>
            <div class="user-area" id="userArea">
                <!-- 未登录时显示 -->
                <div class="user-not-login" id="userNotLogin">
                    <a href="login.html" class="login-link">登录</a>
                    <span class="divider">/</span>
                    <a href="login.html#register" class="register-link">注册</a>
                </div>
                <!-- 已登录时显示（默认隐藏） -->
                <div class="user-logged-in" id="userLoggedIn" style="display: none;">
                    <span class="user-name" id="userName">同学</span>
                    <div class="user-dropdown">
                        <button class="user-avatar" id="userAvatar"></button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="./profile" id="profileLink"> 个人中心 </a>
                            <a href="#" id="logoutBtn"> 退出登录</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="home-content">
            <!-- 1. 大事记板块 (顶部) -->
            <div class="event-board">
                <h2>
                    <span><?xml version="1.0" encoding="utf-8"?>
<!-- License: Apache. Made by Iconscout: https://github.com/Iconscout/unicons -->本周大事记</span>
                    <a href="events.html" style="font-size: 0.9rem; color: rgba(255,255,255,0.8); text-decoration: none; margin-left: auto;">查看全部 →</a>
                </h2>
                <div class="event-scroll" id="weekEvents">
                    <!-- 由 events.js 动态渲染 -->
                </div>
            </div>

            <!-- 2. 双栏区域 (帖子 + 表白墙) -->
            <div class="content-two-columns">
                <!-- 左侧：帖子流 -->
                <div class="post-section">
                    <div class="section-header">
                        <h2> 最新帖子</h2>
                        <button class="new-post-btn" id="newPostBtn">+ 发新帖</button>
                    </div>
                    <div class="post-list" id="postList">
                        <div class="feed-initial-loader" role="status">
                            <span class="feed-initial-orbit"></span>
                            
                        </div>
                    </div>
                    <!-- 查看更多按钮 -->
                    <div class="view-more-wrapper">
                        <button class="view-more-btn" id="morePostsBtn" onclick="location.href='posts'"> 查看更多帖子 </button>
                    </div>
                </div>

                <!-- 右侧：表白墙 -->
                <!-- 右侧：表白墙 -->
                <div class="confession-section">
                    <div class="confession-header">
                        <span style="font-size: 2rem;"></span>
                        <h2>表白墙</h2>
                    </div>
                    <div class="confession-list" id="confessionList">
                        <div class="feed-initial-loader" role="status">
                            <span class="feed-initial-orbit"></span>
                            
                        </div>
                    </div>
                    <div class="view-more-wrapper" style="margin-top: 12px;">
                        <button class="view-more-btn" id="moreConfessionsBtn" onclick="location.href='confession'">更多表白</button>
                    </div>
                </div>
            </div>
        </div>
        <script>
            // 首页大事记初始化
            (async function() {
                await EventsManager.loadEvents();
                EventsManager.renderWeekEvents('#weekEvents');
            })();
        </script>

        <script src="./js/nav-bar.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
        <script type="module" src="./js/home.js"></script>
        
    </body>
</html>
