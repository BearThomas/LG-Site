            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
        })();

        <!-- 1. 首页内联发帖弹窗 -->
    <div class="modal-overlay" id="postModal" style="display: none;">
        <div class="modal-container editor-modal-container">
            <div class="modal-header">
                <h3>发新帖</h3>

                <div class="editor-header-actions">
                    <button
                        type="button"
                        class="preview-toggle-btn"
                        id="togglePostPreviewBtn">
                        预览
                    </button>

                    <button
                        class="modal-close"
                        id="closeModalBtn">
                        &times;
                    </button>
                </div>
            </div>

            <div class="modal-body editor-modal-body">

                <div class="editor-layout">

                    <!-- 左侧编辑器 -->
                    <div class="editor-pane">

                        <div class="form-group">
                            <label>标题</label>
                            <input
                                type="text"
                                id="postTitle"
                                placeholder="输入标题（最多100字）"
                                maxlength="100">
                        </div>

                        <div class="form-group editor-content-group">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <label style="margin-bottom: 0;">内容（支持 Markdown）</label>
                                <button type="button" class="upload-image-btn" id="uploadImageBtn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-image" viewBox="0 0 16 16">
                                      <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                                      <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/>
                                    </svg>
                                    插入图片
                                </button>
                                <input type="file" id="imageFileInput" accept="image/jpeg, image/png, image/webp, image/gif" style="display: none;">
                            </div>

                            <textarea
                                id="postContent"
                                placeholder="# 一级标题

        ## 二级标题

        **加粗**
        *斜体*

        - 列表1
        - 列表2

        > 引用内容

        ```js
        console.log('Hello World');
        ```"
                                maxlength="10000"></textarea>
                        </div>

                    </div>

                    <!-- 右侧预览 -->
                    <div
                        class="preview-pane markdown-body"
                        id="postPreviewPane">

                        <div class="preview-empty">

                            <h2>Markdown 预览</h2>

                            <p>
                                在左侧输入内容后，
                                这里会实时显示最终效果。
                            </p>

                        </div>

                    </div>

                </div>

                <!-- 发布板块 (已隐藏) -->
                <div class="form-group" style="display: none;">
                    <label>发布到板块</label>
                    <div id="postBoardCheckboxes"></div>
                </div>

                <!-- 可见范围 -->
                <div class="form-group">
                    <label>可见范围</label>

                    <select id="visibilityType">
                        <option value="all">
                            🌍 全员可见
                        </option>

                        <option value="specific">
                            🔒 指定学号可见
                        </option>
                    </select>
                </div>

                <!-- 指定用户区域 -->
                <div id="specificUsersArea" style="display:none;">

                    <div class="form-group">

                        <label>添加可见用户</label>

                        <div class="user-search-box">

                            <input
                                type="text"
                                id="userSearchInput"
                                placeholder="输入学号搜索..."
                                maxlength="12"
                                autocomplete="off">

                            <button
                                type="button"
                                class="search-btn"
                                id="searchUserBtn">

                                <svg
                                    fill="#000000"
                                    width="15px"
                                    height="15px"
                                    viewBox="0 0 24 24"
                                    xmlns="http://www.w3.org/2000/svg">

                                    <path d="M21.71,20.29,18,16.61A9,9,0,1,0,16.61,18l3.68,3.68a1,1,0,0,0,1.42,0A1,1,0,0,0,21.71,20.29ZM11,18a7,7,0,1,1,7-7A7,7,0,0,1,11,18Z"/>

                                </svg>

                            </button>

                        </div>

                        <div
                            class="search-results"
                            id="searchResults"
                            style="display:none;">
                        </div>

                    </div>

                    <div class="form-group">

                        <label>
                            已选用户
                            (<span id="selectedCount">0</span>人)
                        </label>

                        <div
                            class="selected-users"
                            id="selectedUsers">

                            <div class="no-users-hint">
                                尚未添加用户
                            </div>

                        </div>

                    </div>

                </div>

                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelPostBtn">
                        取消
                    </button>

                    <button
                        type="button"
                        class="submit-btn"
                        id="submitPostBtn">
                        发布
                    </button>

                </div>

            </div>
        </div>
    </div>

        <!-- 2. 首页内联表白弹窗 (纯文本) -->
        <div class="modal-overlay" id="homeConfessionModal" style="display: none;">
            <div class="modal-container modal-small">
                <div class="modal-header">
                    <h3>💖 匿名表白</h3>
                    <button class="modal-close" id="closeHomeConfessionModal">&times;</button>
                </div>
                <div class="modal-body">
                    <p style="font-size: 0.85rem; color: var(--text-2); margin-bottom: 8px;">勇敢说出你的心意，完全匿名，安全放心</p>
                    <textarea id="homeConfessionContent" class="confession-textarea-modal" placeholder="Ta 的特征？你想对 Ta 说的话..." maxlength="300" rows="5"></textarea>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                        <span style="font-size: 0.8rem; color: var(--text-2);"><span id="homeConfessionCharCount">0</span>/300</span>
                        <button type="button" id="submitHomeConfessionBtn" class="publish-btn-pink">匿名发布</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 首页内联大事记投稿弹窗 -->
        <div class="modal-overlay" id="homeEventModal" style="display: none;">
            <div class="modal-container modal-small">
                <div class="modal-header">
                    <h3>⭐ 投稿校园大事记</h3>
                    <button class="modal-close" id="closeHomeEventModal">&times;</button>
                </div>
                <div class="modal-body">
                    <p style="font-size: 0.85rem; color: var(--text-2); margin-bottom: 8px;">记录校园重大事件，提交后由系统整理与初审</p>
                    <textarea id="homeEventContent" class="confession-textarea-modal" placeholder="请描述事件详情（例如：2026年6月26日初三同学奔赴中考...）" maxlength="500" rows="5"></textarea>
                    <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                        <button type="button" id="submitHomeEventBtn" class="publish-btn-gold">提交大事记</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"></script>
        <script src="./js/markdown.js?v=20260720-4"></script>
        <script type="module" src="./js/posts.js?v=20260720-4"></script>
        <script type="module" src="./js/home.js?v=20260720-3"></script>
        
    </body>
