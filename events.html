    <div id="submitEventModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">

    <script>
        (async function() {
            // 鍔犺浇鏁版嵁
            await EventsManager.loadEvents();
            
            // 鍒濆鍖栫瓫閫夊櫒
            const { bindFilter } = EventsManager.initFilters('#filterContainer');
            
            // 娓叉煋鍑芥暟
            const refresh = () => {
                EventsManager.renderAllEvents('#allEvents');
            };
            
            // 缁戝畾绛涢�変簨浠?
            bindFilter(() => {
                const tag = document.getElementById('filterTag')?.value || 'all';
                const keyword = document.getElementById('filterKeyword')?.value || '';
                const dateRange = document.getElementById('filterDate')?.value || 'all';
                
                EventsManager.renderAllEvents('#allEvents', { tag, keyword, dateRange });
            });
            
            // 棣栨娓叉煋
            refresh();
            
            // 杩斿洖椤堕儴鎸夐挳
            const backBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                backBtn.style.display = window.scrollY > 300 ? 'block' : 'none';
            });
            backBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        })();
    </script>
