<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'auto';
            const isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龙高北小站 | 大事记</title>
    <link rel="icon" type="image/png" href="./image/LG.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/image/LG.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="龙高北小站">
    <link rel="stylesheet" href="./css/light/forall.css">
    <link rel="stylesheet" href="./css/light/events.css">
</head>
<body>
    <div class="title-bar">
        <img src="image/LG.png" width="70" height="70" style="padding: 7px; padding-left: 20px;" alt="龙高北小站">
        <h1 class="site-title" onclick="location.href='./'">龙高北小站</h1>
        <ul class="nav-bar">
            <li class="nav-bar-item" onclick="location.href='./'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5H6v-4h4v4h4.5a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354l-6-6Z"/></svg>
                <span>首页</span>
            </li>
            <li class="nav-bar-item" onclick="location.href='posts'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2A1.5 1.5 0 0 0 2 3.5v11A1.5 1.5 0 0 0 3.5 16h6.086L16 9.586V3.5A1.5 1.5 0 0 0 14.5 2h-11Z"/></svg>
                <span>帖子</span>
            </li>
            <li class="nav-bar-item" onclick="location.href='confession'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053.175 5.45 1.229 9.044 8 13.795c6.771-4.751 7.825-8.345 6.6-10.742C13.486.878 10.4.28 8.717 2.01L8 2.748Z"/></svg>
                <span>表白墙</span>
            </li>
            <li class="nav-bar-item" onclick="location.href='messages.html'" id="navMessages">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2Zm0-14c-3 0-5 2.4-5 5.5 0 2-.5 4-2 5.5h14c-1.5-1.5-2-3.5-2-5.5C13 4.4 11 2 8 2Z"/></svg>
                <span>消息</span>
            </li>
            <li class="nav-bar-item" onclick="location.href='docs'">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14Zm-.93-5.5h1.3c0-1 .14-1.2 1.01-1.86.72-.55 1.45-1.2 1.45-2.5C10.83 3.3 9.3 2.5 7.7 2.5c-1.5 0-3.12.7-3.25 2.68h1.4c.12-.86.72-1.45 1.72-1.45.9 0 1.67.43 1.67 1.46 0 .76-.45 1.12-1.16 1.66-.82.62-1.06 1.25-1.01 2.65ZM7.7 12.7a.9.9 0 1 0 0-1.8.9.9 0 0 0 0 1.8Z"/></svg>
                <span>帮助</span>
            </li>
        </ul>
        <div class="user-area" id="userArea">
            <div class="user-not-login" id="userNotLogin">
                <a href="login.html" class="login-link">登录</a>
                <span class="divider">/</span>
                <a href="login.html#register" class="register-link">注册</a>
            </div>
            <div class="user-logged-in" id="userLoggedIn" style="display: none;">
                <span class="user-name" id="userName">同学</span>
                <div class="user-dropdown">
                    <button class="user-avatar" id="userAvatar" aria-label="打开用户菜单"></button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="./profile" id="profileLink">个人中心</a>
                        <a href="#" id="logoutBtn">退出登录</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main class="events-page">
        <h1 class="events-page-title">大事记</h1>
        <section class="events-apply-panel" aria-label="大事记投稿">
            <div>
                <h2>记录校园里的重要时刻</h2>
                <p>提交事件后将先由 AI 整理和初审，再交由管理员确认发布。</p>
            </div>
            <div class="events-apply-actions">
                <button type="button" id="submitEventBtn" class="event-action-primary">我要投稿</button>
                <button type="button" id="mySubmissionsBtn" class="event-action-secondary">我的投稿记录</button>
                <button type="button" id="adminAuditBtn" class="event-action-secondary" style="display: none; border-color: var(--warning, #f08c00); color: var(--warning, #f08c00);" onclick="location.href='admin-events.html'">审核大事记 (<span id="adminPendingCount">0</span>条待审核)</button>
            </div>
        </section>
        <div id="filterContainer"></div>
        <div id="allEvents" class="events-list"></div>
        <button class="back-to-top" id="backToTop" title="返回顶部" aria-label="返回顶部">↑</button>
    </main>

    <div id="submitEventModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: var(--surface); padding: 20px; border-radius: 12px; max-width: 500px; width: 90%;">
            <h2>我要投稿大事记</h2>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px;">请客观描述发生的校园事件。系统将使用 AI 自动审核并提取要素。</p>
            <textarea id="eventSubmitContent" placeholder="例如：2026年6月26日初三同学奔赴中考……" style="width: 100%; height: 120px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical; margin-bottom: 15px;"></textarea>
            <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 10px;">
                <button id="cancelSubmitBtn" class="btn" style="padding: 8px 16px; border-radius: 8px; background: transparent; border: 1px solid var(--border); color: var(--text); cursor: pointer;">取消</button>
                <button id="confirmSubmitBtn" class="btn btn-primary" style="padding: 8px 16px; border-radius: 8px; background: var(--accent); color: white; border: none; cursor: pointer;">提交审核</button>
            </div>
        </div>
    </div>

    <div id="mySubmissionsModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: var(--surface); padding: 20px; border-radius: 12px; max-width: 600px; width: 90%;">
            <h2>我的投稿记录</h2>
            <div id="mySubmissionsList" style="margin-top: 15px; margin-bottom: 15px; max-height: 60vh; overflow-y: auto;">
                <div style="text-align: center; color: var(--text-muted); padding: 20px;">暂无记录</div>
            </div>
            <div class="modal-actions" style="display: flex; justify-content: flex-end;">
                <button id="closeSubmissionsBtn" class="btn" style="padding: 8px 16px; border-radius: 8px; background: transparent; border: 1px solid var(--border); color: var(--text); cursor: pointer;">关闭</button>
            </div>
        </div>
    </div>

    <script src="./js/events.js"></script>
    <script>
        (async function () {
            await EventsManager.loadEvents();
            const { bindFilter } = EventsManager.initFilters('#filterContainer');
            const refresh = () => EventsManager.renderAllEvents('#allEvents');
            bindFilter(() => {
                const tag = document.getElementById('filterTag')?.value || 'all';
                const keyword = document.getElementById('filterKeyword')?.value || '';
                const dateRange = document.getElementById('filterDate')?.value || 'all';
                EventsManager.renderAllEvents('#allEvents', { tag, keyword, dateRange });
            });
            refresh();
            const backButton = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                backButton.style.display = window.scrollY > 300 ? 'block' : 'none';
            });
            backButton.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        })();
    </script>
    <script src="./js/theme-change.js"></script>
    <script src="./js/nav-bar.js?v=20260720-4"></script>
</body>
</html>
