<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龙高北小站 | 大事记</title>
    <link rel="icon" type="image/png" href="./image/LG.png">
    <link rel="stylesheet" href="./css/light/forall.css">
    <link rel="stylesheet" href="./css/light/events.css">
</head>
<body>
    <!-- 复用相同导航栏 -->
    <div class="title-bar">
        <img src="image/LG.png" width="70px" height="70px" style="padding: 7px;padding-left: 20px;">
        <h1 class="site-title">龙高北小站</h1>
        <ul class="nav-bar">
            <li class="nav-bar-item" onclick="location.href='index.html'">首页</li>
            <li class="nav-bar-item" onclick="location.href='posts'">帖子</li>
            <li class="nav-bar-item active" id="history-btn">大事记</li>
            <li class="nav-bar-item" onclick="location.href='confession'"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-heart" viewBox="0 0 16 16" style="margin-right: 4px; vertical-align: text-bottom;"><path d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"/></svg>表白墙</li>
            <li class="nav-bar-item" onclick="location.href='docs'">帮助</li>
        </ul>
    </div>

    <div class="events-page">
        <h1 class="events-page-title"> 大事记</h1>
        
        <!-- 筛选栏 -->
        <div id="filterContainer"></div>
        
        <!-- 大事记列表 -->
        <div id="allEvents" class="events-list"></div>
        
        <!-- 返回顶部 -->
        <button class="back-to-top" id="backToTop" title="返回顶部">⬆</button>
    </div>

    <script src="./js/events.js"></script>
    <script>
        (async function() {
            // 加载数据
            await EventsManager.loadEvents();
            
            // 初始化筛选器
            const { bindFilter } = EventsManager.initFilters('#filterContainer');
            
            // 渲染函数
            const refresh = () => {
                EventsManager.renderAllEvents('#allEvents');
            };
            
            // 绑定筛选事件
            bindFilter(() => {
                const tag = document.getElementById('filterTag')?.value || 'all';
                const keyword = document.getElementById('filterKeyword')?.value || '';
                const dateRange = document.getElementById('filterDate')?.value || 'all';
                
                EventsManager.renderAllEvents('#allEvents', { tag, keyword, dateRange });
            });
            
            // 首次渲染
            refresh();
            
            // 返回顶部按钮
            const backBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                backBtn.style.display = window.scrollY > 300 ? 'block' : 'none';
            });
            backBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        })();
    </script>

    <script src="./js/theme-change.js"></script>
    <script src="./js/nav-bar.js"></script>
    
</body>
</html>
