<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>龙高北小站 | 登录</title>
    <link rel="icon" type="image/png" href="./image/LG.png">
    <link rel="stylesheet" href="./css/light/login.css">
</head>
<body>
    <div class="login-container">
        <!-- Logo 区域 -->
        <div class="login-logo">
            <img src="./image/LG.png" alt="Logo">
            <h1>龙高北小站</h1>
            <p>非官方校园社区 · 学号登录</p>
        </div>

        <!-- 登录卡片 -->
        <div class="login-card">
            <!-- 选项卡 -->
            <div class="login-tabs">
                <div class="login-tab active" data-tab="login">登录</div>
                <div class="login-tab" data-tab="register">注册</div>
            </div>

            <!-- 错误/成功提示 -->
            <div class="error-message" id="errorMsg"></div>
            <div class="success-message" id="successMsg"></div>

            <!-- 登录表单 -->
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label>学号</label>
                    <div class="input-with-prefix">
                        <span class="prefix">S</span>
                        <input type="text" id="loginStudentId" placeholder="例如: 20240101" maxlength="20" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="输入密码" autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn" id="loginBtn">登 录</button>
            </form>

            <!-- 注册表单（默认隐藏） -->
            <form class="login-form hidden" id="registerForm">
                <div class="form-group">
                    <label>学号</label>
                    <div class="input-with-prefix">
                        <span class="prefix">S</span>
                        <input type="text" id="regStudentId" placeholder="例如: 20240101" maxlength="20" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="6-20位字符" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirmPassword" placeholder="再次输入密码" autocomplete="new-password">
                </div>
                <button type="submit" class="login-btn" id="registerBtn">注 册</button>
                <p class="form-hint" style="text-align: center; margin-top: 16px;">
                    仅限本校学生注册 · 学号需真实有效
                </p>
            </form>
        </div>

        <!-- 页脚 -->
        <div class="login-footer">
            <span>🐻 学生独立项目 · 非官方网站</span>
        </div>
    </div>
    <script src="./js/theme-change.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script src="./js/login.js"></script>
        
</body>
</html>
