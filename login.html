<!DOCTYPE html>
<html lang="zh">
<head>
    <script>
        (function() {
            const t = localStorage.getItem('theme') || 'auto';
            const isDark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
            document.documentElement.classList.toggle('dark', isDark);
            document.documentElement.classList.toggle('light', !isDark);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>榫欓珮鍖楀皬绔?| 鐧诲綍</title>
    <link rel="icon" type="image/png" href="./image/LG.png">
    <link rel="stylesheet" href="./css/light/forall.css">
    <link rel="stylesheet" href="./css/light/login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <!-- Logo 鍖哄煙 -->

            <img src="./image/LG.png" alt="Logo">

        </div>

        <!-- 鐧诲綍鍗＄墖 -->

            <!-- 閫夐」鍗?-->

                <div class="login-tab" data-tab="register">娉ㄥ唽</div>
            </div>

            <!-- 閿欒/鎴愬姛鎻愮ず -->

            <div class="success-message" id="successMsg"></div>

                <div class="form-group">
                    <label>瀛﹀彿</label>
                    <div class="input-with-prefix">
                        <span class="prefix">S</span>
                        <input type="text" id="loginStudentId" placeholder="渚嬪: 20240101" maxlength="20" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>瀵嗙爜</label>
                    <input type="password" id="loginPassword" placeholder="杈撳叆瀵嗙爜" autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn" id="loginBtn">鐧?褰?/button>
            </form>

            <!-- 娉ㄥ唽琛ㄥ崟锛堥粯璁ら殣钘忥級 -->
            <form class="login-form hidden" id="registerForm">
                <div class="form-group">
                    <label>瀛﹀彿</label>
                    <div class="input-with-prefix">
                        <span class="prefix">S</span>
                        <input type="text" id="regStudentId" placeholder="渚嬪: 20240101" maxlength="20" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>瀵嗙爜</label>
                    <input type="password" id="regPassword" placeholder="6-20浣嶅瓧绗? autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>纭瀵嗙爜</label>
                    <input type="password" id="regConfirmPassword" placeholder="鍐嶆杈撳叆瀵嗙爜" autocomplete="new-password">
                </div>
                <button type="submit" class="login-btn" id="registerBtn">娉?鍐?/button>
                <p class="form-hint" style="text-align: center; margin-top: 16px;">
                    浠呴檺鏈牎瀛︾敓娉ㄥ唽 路 瀛﹀彿闇€鐪熷疄鏈夋晥

        </div>

        <!-- 椤佃剼 -->
        <div class="login-footer" style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
            <a href="download.html" class="download-app-link-footer" style="color: var(--accent); text-decoration: none; font-size: 0.88rem; font-weight: 500;">涓嬭浇瀹夊崜瀹㈡埛绔?APP</a>
            <span> 瀛︾敓鐙珛椤圭洰 路 闈炲畼鏂圭綉绔?/span>
        </div>
    </div>
    <script src="./js/theme-change.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script src="./js/login.js"></script>
        
</body>
</html>
