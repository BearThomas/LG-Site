name: Keep Appwrite Active (Prevent Sleep)

on:
  schedule:
    # 每天 UTC 02:00 和 14:00 (北京时间 10:00 和 22:00) 自动触发一次防休眠心跳
    - cron: '0 2,14 * * *'
  workflow_dispatch: # 支持在 GitHub 后台 Actions 标签页手动点击运行测试

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to Appwrite Cloud
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT || 'https://sgp.cloud.appwrite.io/v1' }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID || 'lg' }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          echo "=========================================="
          echo " Starting Appwrite Cloud Keep-Alive Ping"
          echo " Endpoint: $APPWRITE_ENDPOINT"
          echo " Project ID: $APPWRITE_PROJECT_ID"
          echo "=========================================="
          
          # 1. 携带 Project ID 触发应用心跳
          if [ -n "$APPWRITE_PROJECT_ID" ]; then
            echo "--> Sending project activity ping..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Appwrite-Project: $APPWRITE_PROJECT_ID" "$APPWRITE_ENDPOINT/account")
            echo "    Project Account Ping Status: $HTTP_STATUS"
            
            # 2. 如果配置了 API KEY，发送鉴权 API 请求（100% 记录为活跃操作）
            if [ -n "$APPWRITE_API_KEY" ]; then
              echo "--> Sending authenticated admin heartbeat..."
              AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Appwrite-Project: $APPWRITE_PROJECT_ID" -H "X-Appwrite-Key: $APPWRITE_API_KEY" "$APPWRITE_ENDPOINT/users?limit=1")
              echo "    Users API Status: $AUTH_STATUS"
              
              BUCKET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Appwrite-Project: $APPWRITE_PROJECT_ID" -H "X-Appwrite-Key: $APPWRITE_API_KEY" "$APPWRITE_ENDPOINT/storage/buckets?limit=1")
              echo "    Storage API Status: $BUCKET_STATUS"
            else
              echo "💡 提示: 强烈建议在 GitHub Secrets 中配置 APPWRITE_API_KEY，带 API Key 的请求能 100% 被 Appwrite 记录为项目活跃数据。"
            fi
            echo "✅ Appwrite keep-alive heartbeat completed!"
          else
            echo "⚠️ 缺少 APPWRITE_PROJECT_ID 变量，请在 GitHub 仓库 Settings -> Secrets -> Actions 中配置。"
          fi

      - name: Send Heartbeat to Cloudflare Pages Site
        run: |
          echo "--> Pinging Cloudflare Pages Worker Endpoint..."
          curl -s -L "https://longgaobei.pages.dev/api/runtime-config" > /dev/null || true
          echo "✅ All keep-alive heartbeats completed!"
