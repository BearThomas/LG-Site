name: Daily Data Archive and Chunking

on:
  schedule:
    - cron: '0 19 * * *' # Runs at 19:00 UTC every day (03:00 Beijing time)
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Archive and Chunk Script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_ENCRYPT_KEY: ${{ secrets.BACKUP_ENCRYPT_KEY }}
        run: node scripts/sync-backup.mjs

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data-backups/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: archive and chunk data [skip ci]" && git push)
